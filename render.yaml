services:
  # SentriX Backend API on Render
  - type: web
    name: sentrix-backend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    rootDir: backend
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: sentrix-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        sync: false
      - key: LLM_PROVIDER
        value: openai
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: gpt-4o-mini
      - key: ENABLE_LLM
        value: "true"

databases:
  - name: sentrix-db
    databaseName: sentrix
    user: sentrix_user
    plan: free
    region: oregon
