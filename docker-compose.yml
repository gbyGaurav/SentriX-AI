version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: uamd-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: uamd_user
      POSTGRES_PASSWORD: uamd_password
      POSTGRES_DB: uamd_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uamd_user -d uamd_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: uamd-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://uamd_user:uamd_password@db:5432/uamd_db
      DATABASE_URL_SYNC: postgresql://uamd_user:uamd_password@db:5432/uamd_db
      ALLOWED_ORIGINS: http://localhost:3000,https://uamd.vercel.app
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      ENABLE_LLM: ${ENABLE_LLM:-true}
      ENABLE_VIDEO_PROCESSING: "true"
      ENABLE_AUDIO_PROCESSING: "false"
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: uamd-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000
    ports:
      - "3000:3000"

volumes:
  postgres_data:
